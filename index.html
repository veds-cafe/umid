<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantrex Media — Upgrade Your Life</title>
<meta name="description" content="Vantrex Media: telefon aksesuarları və rəqəmsal marketinq xidmətləri. WhatsApp ilə sifariş edin.">
<meta name="theme-color" content="#06030c">
<link rel="icon" href="assets/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#06030c;
  --bg-2:#0d0817;
  --card:#110b1f;
  --line:rgba(167,132,255,.22);
  --line-strong:rgba(167,132,255,.5);
  --violet:#7b3ff2;
  --violet-hi:#9b6bff;
  --violet-soft:#c9b2ff;
  --silver:#ecebf3;
  --muted:#aaa3c2;
  --wa:#25d366;
  --wa-ink:#04140a;
  --silver-grad:linear-gradient(180deg,#ffffff 0%,#d4d2e4 55%,#9a97b2 100%);
  --violet-grad:linear-gradient(180deg,#c4a2ff 0%,#8446ff 60%,#5d27d8 100%);
  --radius:22px;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:88px;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--silver);
  font:500 1rem/1.65 "Montserrat","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:
    radial-gradient(900px 600px at 105% 0%,rgba(123,63,242,.22),transparent 60%),
    radial-gradient(800px 600px at -10% 55%,rgba(123,63,242,.14),transparent 60%);
  background-repeat:no-repeat;
}
img{max-width:100%;display:block}
a{color:inherit}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{width:min(1180px,100% - 40px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.i-fill{fill:currentColor;stroke:none}

:focus-visible{outline:3px solid var(--violet-soft);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:12px;top:-60px;background:#fff;color:#000;padding:10px 16px;border-radius:10px;z-index:100;font-weight:700}
.skip:focus{top:12px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  min-height:48px;padding:0 24px;border-radius:999px;border:1px solid transparent;
  font-weight:700;font-size:.95rem;text-decoration:none;line-height:1.2;text-align:center;
  transition:transform .18s ease,box-shadow .18s ease,background .18s ease,border-color .18s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn-wa{background:var(--wa);color:var(--wa-ink);box-shadow:0 10px 30px -10px rgba(37,211,102,.65)}
.btn-wa:hover{box-shadow:0 14px 34px -8px rgba(37,211,102,.8)}
.btn-violet{background:linear-gradient(135deg,#8a4dff,#5b25d6);color:#fff;box-shadow:0 12px 34px -12px rgba(123,63,242,.9)}
.btn-ghost{border-color:var(--line-strong);background:rgba(123,63,242,.08);color:var(--silver)}
.btn-ghost:hover{background:rgba(123,63,242,.22)}
.btn-block{width:100%}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:50;
  background:rgba(6,3,12,.74);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
.header-inner{display:flex;align-items:center;gap:14px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;margin-right:auto}
.brand-mark{height:34px;width:auto}
.brand-word{height:27px;width:auto}
.nav{display:none}
.nav a{
  text-decoration:none;font-weight:600;font-size:.92rem;color:var(--muted);
  padding:10px 14px;border-radius:999px;transition:color .15s,background .15s;
}
.nav a:hover{color:#fff;background:rgba(123,63,242,.18)}
.header-wa{display:none}
.lang{display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(13,8,23,.8)}
.lang button{
  border:0;background:transparent;min-width:36px;min-height:34px;padding:0 8px;border-radius:999px;
  font-weight:700;font-size:.74rem;letter-spacing:.04em;color:var(--muted);
}
.lang button[aria-pressed="true"]{background:linear-gradient(135deg,#8a4dff,#5b25d6);color:#fff}
.menu-btn{
  width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:rgba(13,8,23,.8);
  display:grid;place-items:center;
}
.menu-btn .i{width:22px;height:22px}
.menu-btn .i-close{display:none}
.menu-btn[aria-expanded="true"] .i-open{display:none}
.menu-btn[aria-expanded="true"] .i-close{display:block}
.nav.is-open{
  display:grid;position:absolute;left:0;right:0;top:100%;gap:4px;padding:14px 20px 20px;
  background:rgba(8,4,16,.97);border-bottom:1px solid var(--line);
}
.nav.is-open a{padding:14px 12px;font-size:1rem}

/* ---------- hero ---------- */
.hero{position:relative;overflow:hidden}
.hero::before{
  content:"";position:absolute;width:980px;height:980px;left:-640px;top:-640px;border-radius:50%;
  background:radial-gradient(circle at 70% 70%,rgba(255,255,255,.08),rgba(255,255,255,.02) 55%,transparent 70%);
  box-shadow:inset -8px 8px 30px -6px rgba(123,63,242,.55);pointer-events:none;
}
.hero-grid{position:relative;display:grid;gap:40px;padding-block:48px 56px;align-items:center}
.hero h1{
  font-weight:900;font-style:italic;line-height:.98;letter-spacing:-.025em;
  font-size:clamp(3rem,10.5vw,6.4rem);
}
.hero h1 span{display:block;width:max-content;max-width:100%;padding:0 .12em .06em 0;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero h1 .l1{background-image:var(--silver-grad)}
.hero h1 .l2{background-image:var(--violet-grad)}
.hero-sub{margin-top:26px;max-width:46ch;font-size:1.06rem;color:var(--muted)}
.hero-actions{margin-top:32px;display:flex;flex-wrap:wrap;gap:12px}
.hero-shot{
  border-radius:28px;overflow:hidden;border:1px solid var(--line-strong);
  box-shadow:0 40px 90px -30px rgba(123,63,242,.75),0 0 0 6px rgba(123,63,242,.06);
  background:#0a0614;
}
.hero-shot img{width:100%;height:auto}

@keyframes rise{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.hero h1 .l1{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.hero h1 .l2{animation:rise .8s .14s cubic-bezier(.2,.7,.2,1) both}
.hero-shot{animation:fade 1s .3s both}

/* ---------- sections ---------- */
.section{padding-block:clamp(52px,7vw,88px)}
.section-head{display:grid;gap:18px;margin-bottom:40px}
.h2{font-weight:800;font-style:italic;letter-spacing:-.02em;line-height:1.08;font-size:clamp(2rem,5vw,3.2rem)}
.h2-silver{background:var(--silver-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em}
.lead{color:var(--muted);max-width:56ch}

/* products */
.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  min-height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line);
  background:rgba(13,8,23,.8);font-weight:600;font-size:.88rem;color:var(--muted);
  transition:background .15s,color .15s,border-color .15s;
}
.chip:hover{border-color:var(--line-strong);color:#fff}
.chip[aria-pressed="true"]{background:linear-gradient(135deg,#8a4dff,#5b25d6);border-color:transparent;color:#fff}
.grid{display:grid;gap:22px;grid-template-columns:1fr}
.card{
  display:flex;flex-direction:column;border-radius:var(--radius);overflow:hidden;
  background:linear-gradient(180deg,#140d27,#0b0715);border:1px solid var(--line);
  transition:transform .22s ease,border-color .22s ease,box-shadow .22s ease;
}
.card:hover{transform:translateY(-5px);border-color:var(--line-strong);box-shadow:0 24px 50px -28px rgba(123,63,242,.9)}
.card figure{
  position:relative;aspect-ratio:4/5;overflow:hidden;
  background:radial-gradient(75% 60% at 50% 42%,rgba(123,63,242,.38),transparent 72%),#09050f;
}
.card figure img{position:absolute;inset:16px;width:calc(100% - 32px);height:calc(100% - 32px);object-fit:contain}
.card-body{display:flex;flex-direction:column;gap:12px;padding:20px 20px 22px;flex:1}
.card h3{font-size:1.1rem;font-weight:700;line-height:1.3}
.card .tag{color:var(--violet-soft);font-style:italic;font-weight:600;font-size:.92rem;margin-top:-6px}
.feats{display:flex;flex-wrap:wrap;gap:6px}
.feats li{font-size:.76rem;font-weight:600;color:var(--silver);padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:rgba(123,63,242,.1)}
.card-foot{margin-top:auto;display:grid;gap:12px;padding-top:6px}
.price{font-size:.86rem;color:var(--muted);font-weight:600}

/* steps */
.steps{display:grid;gap:16px}
.step{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;padding:24px;border-radius:var(--radius);border:1px solid var(--line);background:rgba(17,11,31,.7)}
.step .n{
  grid-row:span 2;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;
  font-weight:800;font-size:1.15rem;background:linear-gradient(135deg,#8a4dff,#5b25d6);
}
.step h3{font-size:1.08rem;font-weight:700;align-self:end}
.step p{color:var(--muted);font-size:.95rem}

/* services */
.svc-grid{display:grid;gap:40px}
.svc-intro{display:grid;gap:18px;align-content:start}
.slogan{font-style:italic;font-weight:600;color:var(--violet-soft);font-size:1.08rem}
.channels{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.channels li{padding:6px 14px;border-radius:999px;border:1px solid var(--line);font-size:.82rem;font-weight:700;color:var(--silver)}
.svc-cards{display:grid;gap:16px}
.svc{padding:26px;border-radius:var(--radius);border:1px solid var(--line);background:linear-gradient(180deg,#140d27,#0b0715);display:grid;gap:10px;align-content:start}
.svc .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(123,63,242,.16);border:1px solid var(--line-strong);color:var(--violet-soft)}
.svc .ico .i{width:26px;height:26px}
.svc h3{font-size:1.08rem;font-weight:700}
.svc p{color:var(--muted);font-size:.93rem}
.growth{width:min(320px,100%);margin-top:8px}
.approach{display:grid;gap:16px;margin-top:56px}
.approach div{padding:26px;border-radius:var(--radius);border:1px solid var(--line);background:rgba(17,11,31,.7)}
.approach h3{font-weight:900;font-style:italic;font-size:1.7rem;line-height:1.1;background:var(--violet-grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.1em;width:max-content;max-width:100%}
.approach p{margin-top:8px;color:var(--muted);font-size:.95rem}

/* instagram */
.ig-grid{display:grid;gap:48px;align-items:center}
.ig-list{display:grid;gap:14px;margin:26px 0 32px}
.ig-list li{display:flex;gap:14px;align-items:center;font-weight:600}
.ig-list .ico{width:42px;height:42px;flex:none;border-radius:12px;display:grid;place-items:center;background:rgba(123,63,242,.16);border:1px solid var(--line);color:var(--violet-soft)}
.phone{
  width:min(310px,100%);margin-inline:auto;border-radius:42px;padding:12px;
  background:linear-gradient(160deg,#5a34c4,#14091f 42%,#0a0612);
  border:1px solid rgba(190,150,255,.5);box-shadow:0 50px 100px -40px rgba(123,63,242,.85);
}
.screen{background:#07040d;border-radius:31px;padding:20px 16px 16px;display:grid;gap:14px}
.ig-handle{display:flex;justify-content:space-between;font-weight:700;font-size:.95rem}
.ig-top{display:flex;gap:14px;align-items:center}
.avatar{width:70px;height:70px;border-radius:50%;padding:3px;background:conic-gradient(from 200deg,#ff9a3c,#c13584,#7b3ff2,#ff9a3c);flex:none}
.avatar span{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:#050308}
.avatar img{width:44px;height:auto}
.ig-name{font-weight:700;font-size:.92rem;line-height:1.3}
.ig-at{font-size:.78rem;color:var(--muted)}
.ig-bio{font-size:.8rem;line-height:1.5;color:var(--silver)}
.ig-bio b{display:block;font-weight:700;margin-bottom:2px}
.ig-follow{display:grid;place-items:center;min-height:38px;border-radius:10px;background:linear-gradient(135deg,#8a4dff,#5b25d6);font-weight:700;font-size:.85rem}
.hl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.hl div{display:grid;gap:6px;justify-items:center;font-size:.62rem;font-weight:600;color:var(--muted)}
.hl i{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong);background:rgba(123,63,242,.12);color:var(--violet-soft)}
.hl .i{width:22px;height:22px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tiles b{aspect-ratio:1;border-radius:6px;background:linear-gradient(150deg,#3a1d86,#0d0719)}
.tiles b:nth-child(2){background:linear-gradient(150deg,#6a35e8,#150a2c)}
.tiles b:nth-child(4){background:linear-gradient(150deg,#1b0f3a,#4a24b8)}
.tiles b:nth-child(5){background:linear-gradient(150deg,#2a1560,#0a0612)}

/* contact */
.contact-card{
  display:grid;gap:36px;align-items:center;padding:clamp(24px,5vw,60px);border-radius:32px;
  border:1px solid var(--line-strong);
  background:radial-gradient(700px 400px at 100% 0%,rgba(123,63,242,.3),transparent 65%),linear-gradient(180deg,#12091f,#08040f);
}
.contact-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.contact-num{margin-top:22px;color:var(--muted);font-weight:600}
.contact-num a{color:var(--silver);text-decoration:none;font-weight:800;font-size:1.25rem;letter-spacing:.01em;display:inline-block}
.contact-num a:hover{color:var(--violet-soft)}
.bag{border-radius:24px;overflow:hidden;border:1px solid var(--line);box-shadow:0 40px 80px -40px rgba(123,63,242,.8)}
.bag img{width:100%;height:auto}

/* footer */
.site-footer{border-top:1px solid var(--line);padding-block:36px 100px}
.foot{display:flex;flex-wrap:wrap;gap:20px 32px;align-items:center;justify-content:space-between}
.foot img{height:44px;width:auto}
.foot p{color:var(--muted);font-size:.86rem}
.foot .motto{letter-spacing:.22em;font-size:.74rem;font-weight:600;color:var(--silver)}
.foot .motto em{font-style:normal;color:var(--violet-hi);padding-inline:.5em}

/* floating WhatsApp */
.fab{
  position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:60;
  width:60px;height:60px;border-radius:50%;display:grid;place-items:center;
  background:var(--wa);color:var(--wa-ink);text-decoration:none;
  box-shadow:0 14px 34px -8px rgba(37,211,102,.7);transition:transform .18s ease;
}
.fab:hover{transform:scale(1.07)}
.fab .i{width:32px;height:32px}
.fab::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--wa);animation:ring 2.2s ease-out 1.2s 3 both}
@keyframes ring{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.7)}}

/* ---------- breakpoints ---------- */
@media (min-width:480px){
  .brand-word{display:block}
}
@media (max-width:479px){
  .brand-word{display:none}
  .lang button{min-width:32px;padding:0 6px}
}
@media (min-width:640px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .steps{grid-template-columns:repeat(3,1fr)}
  .step{grid-template-columns:1fr}
  .step .n{grid-row:auto}
  .svc-cards{grid-template-columns:repeat(2,1fr)}
  .approach{grid-template-columns:repeat(3,1fr)}
}
@media (min-width:960px){
  .nav{display:flex;gap:2px}
  .menu-btn{display:none}
  .header-wa{display:inline-flex;min-height:44px;padding:0 18px;font-size:.88rem}
  .hero-grid{grid-template-columns:1.02fr .98fr;gap:56px;padding-block:72px 64px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .section-head{grid-template-columns:1fr auto;align-items:end}
  .section-head > div:first-child{display:grid;gap:18px}
  .svc-grid{grid-template-columns:.85fr 1.15fr;gap:56px;align-items:start}
  .svc-intro{position:sticky;top:104px}
  .ig-grid{grid-template-columns:1.1fr .9fr}
  .contact-card{grid-template-columns:1.1fr .9fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

  /* ============ HELPERS ============ */
  var state = { lang: DEFAULT_LANG, cat: "all" };

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;" }[c];
    });
  }
  function waLink(text) {
    return "https://wa.me/" + WA_NUMBER + "?text=" + encodeURIComponent(text);
  }
  function t(key) { return T[state.lang][key] || T[DEFAULT_LANG][key] || key; }

  function pickLang() {
    try {
      var q = new URLSearchParams(location.search).get("lang");
      if (LANGS.indexOf(q) > -1) return q;
    } catch (e) {}
    try {
      var s = localStorage.getItem("vx-lang");
      if (LANGS.indexOf(s) > -1) return s;
    } catch (e) {}
    var n = ((navigator.languages && navigator.languages[0]) || navigator.language || "").slice(0, 2).toLowerCase();
    return LANGS.indexOf(n) > -1 ? n : DEFAULT_LANG;
  }

  /* ============ RENDER ============ */
  function renderProducts() {
    var grid = document.getElementById("productGrid");
    var l = state.lang;
    var html = PRODUCTS.filter(function (p) {
      return state.cat === "all" || p.cat === state.cat;
    }).map(function (p) {
      var name = p.name[l];
      var feats = p.feats.map(function (f) { return "<li>" + esc(f[l]) + "</li>"; }).join("");
      return (
        '<article class="card">' +
          '<figure><img src="' + esc(p.img) + '" alt="' + esc(name) + '" loading="lazy"></figure>' +
          '<div class="card-body">' +
            "<h3>" + esc(name) + "</h3>" +
            (p.tag ? '<p class="tag">' + esc(p.tag[l]) + "</p>" : "") +
            (feats ? '<ul class="feats">' + feats + "</ul>" : "") +
            '<div class="card-foot">' +
              '<span class="price">' + esc(t("price.ask")) + "</span>" +
              '<a class="btn btn-wa btn-block" target="_blank" rel="noopener" href="' + esc(waLink(MSG.product[l](name))) + '">' +
                '<svg class="i i-fill"><use href="#i-wa"/></svg><span>' + esc(t("btn.order")) + "</span>" +
              "</a>" +
            "</div>" +
          "</div>" +
        "</article>"
      );
    }).join("");
    grid.innerHTML = html;
  }

  function applyLang(l) {
    state.lang = l;
    var root = document.documentElement;
    root.lang = l;

    document.title = t("meta.title");
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute("content", t("meta.desc"));

    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    document.querySelectorAll("[data-i18n-aria]").forEach(function (el) { el.setAttribute("aria-label", t(el.getAttribute("data-i18n-aria"))); });
    document.querySelectorAll("[data-i18n-alt]").forEach(function (el) { el.setAttribute("alt", t(el.getAttribute("data-i18n-alt"))); });
    document.querySelectorAll("[data-wa]").forEach(function (el) {
      el.setAttribute("href", waLink(MSG[el.getAttribute("data-wa")][l]));
    });
    document.querySelectorAll(".lang button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-lang") === l));
    });
    renderProducts();
    try { localStorage.setItem("vx-lang", l); } catch (e) {}
  }

  /* ============ EVENTS ============ */
  document.querySelector(".lang").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-lang]");
    if (b) applyLang(b.getAttribute("data-lang"));
  });

  document.getElementById("filters").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-cat]");
    if (!b) return;
    state.cat = b.getAttribute("data-cat");
    document.querySelectorAll("#filters .chip").forEach(function (c) {
      c.setAttribute("aria-pressed", String(c === b));
    });
    renderProducts();
  });

  var nav = document.getElementById("nav");
  var menuBtn = document.getElementById("menuBtn");
  function setMenu(open) {
    nav.classList.toggle("is-open", open);
    menuBtn.setAttribute("aria-expanded", String(open));
  }
  menuBtn.addEventListener("click", function () { setMenu(!nav.classList.contains("is-open")); });
  nav.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false); });
  window.addEventListener("resize", function () { if (window.innerWidth >= 960) setMenu(false); });

  document.getElementById("year").textContent = new Date().getFullYear();
  applyLang(pickLang());
